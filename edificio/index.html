<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metaverso J.Pachón - Edificio Residencial</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        #info { position: absolute; top: 20px; width: 100%; text-align: center; color: white; font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; pointer-events: none; z-index: 100; text-shadow: 2px 2px 4px #000; }
        #loading { position: absolute; top: 50%; left: 0; width: 100%; text-align: center; color: white; font-family: Arial, sans-serif; font-size: 30px; font-weight: bold; pointer-events: none; z-index: 100; }
        #fade { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: black; opacity: 0; pointer-events: none; transition: opacity 0.5s ease-in-out; z-index: 999; }
    </style>
</head>
<body>
    <div id="info">Haz clic para entrar. (Usa W, A, S, D y el mouse)</div>
    <div id="loading">Cargando edificio...</div>
    <div id="fade"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        let ubicacionActual = "pasillo"; 
        let transicionEnCurso = false;
        
        let modeloAptoTipo, modeloPenthouse;
        let grupoPasillo, ambientLight, cajaExterior;
        let portalFondo, portalIzq, portalDer;
        let techoTipo, techoPenthouse;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a); 
            scene.fog = new THREE.Fog(0x1a1a1a, 1, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            ambientLight = new THREE.AmbientLight(0xffeedd, 1.2); 
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0); 
            dirLight.position.set(0, 10, 10);
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            
            document.body.addEventListener('click', function () { controls.lock(); });
            controls.addEventListener('lock', function () { document.getElementById('info').style.display = 'none'; });
            controls.addEventListener('unlock', function () { 
                document.getElementById('info').style.display = 'block';
                document.getElementById('info').innerText = "Haz clic para volver a entrar (ESC para salir)";
            });
            scene.add(controls.getObject());

            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                }
            };
            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                }
            };
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            cajaExterior = new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20), new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide }));
            cajaExterior.position.set(0, 10, 0);
            cajaExterior.visible = false;
            scene.add(cajaExterior);

            const loader = new GLTFLoader();
            
            // --- LA SOLUCIÓN: Rutas Absolutas con la URL base ---
            // Usamos window.location.origin para que siempre sepa dónde está parado
            const basePath = window.location.origin + window.location.pathname.replace('index.html', '');
            
            const urlTipo = basePath + 'apartamento_tipo.glb'; 
            const urlPenthouse = basePath + 'penthouse.glb';

            console.log("Buscando Tipo en:", urlTipo);
            console.log("Buscando Penthouse en:", urlPenthouse);

            loader.load(urlTipo, function (gltf) {
                modeloAptoTipo = gltf.scene;
                configurarModelo(modeloAptoTipo);
                modeloAptoTipo.visible = false;
                scene.add(modeloAptoTipo);
                
                const box = new THREE.Box3().setFromObject(modeloAptoTipo);
                const size = box.getSize(new THREE.Vector3());
                techoTipo = new THREE.Mesh(new THREE.PlaneGeometry(15, 15), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
                techoTipo.rotation.x = Math.PI / 2;
                techoTipo.position.set(0, (size.y * modeloAptoTipo.scale.y) + 0.1, 0);
                techoTipo.visible = false;
                scene.add(techoTipo);

                // Cargar el Penthouse
                loader.load(urlPenthouse, function (gltfP) {
                    modeloPenthouse = gltfP.scene;
                    configurarModelo(modeloPenthouse);
                    modeloPenthouse.visible = false;
                    scene.add(modeloPenthouse);

                    const boxP = new THREE.Box3().setFromObject(modeloPenthouse);
                    const sizeP = boxP.getSize(new THREE.Vector3());
                    techoPenthouse = new THREE.Mesh(new THREE.PlaneGeometry(15, 15), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
                    techoPenthouse.rotation.x = Math.PI / 2;
                    techoPenthouse.position.set(0, (sizeP.y * modeloPenthouse.scale.y) + 0.1, 0);
                    techoPenthouse.visible = false;
                    scene.add(techoPenthouse);

                    document.getElementById('loading').style.display = 'none';
                    crearPasillo();
                    controls.getObject().position.set(0, 1.6, 10); 
                }, undefined, function (error) {
                    document.getElementById('loading').innerText = "❌ Error al cargar penthouse.glb. Revisa la consola F12.";
                    console.error("Error Penthouse:", error);
                });
                
            }, undefined, function (error) {
                document.getElementById('loading').innerText = "❌ Error al cargar apartamento_tipo.glb.";
                console.error("Error Tipo:", error);
            });

            window.addEventListener('resize', onWindowResize);
        }

        // ... (El resto de las funciones exactamente iguales) ...
        function configurarModelo(modelo) {
            const box = new THREE.Box3().setFromObject(modelo);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxSize = Math.max(size.x, size.y, size.z);
            const scaleFactor = 10 / maxSize; 
            modelo.scale.set(scaleFactor, scaleFactor, scaleFactor);
            modelo.position.x = -center.x * scaleFactor;
            modelo.position.y = -box.min.y * scaleFactor; 
            modelo.position.z = -center.z * scaleFactor;
        }

        function crearPasillo() {
            grupoPasillo = new THREE.Group();
            const matPiso = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.8 }); 
            const matPared = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.9 }); 
            const matTecho = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const matMarco = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 }); 
            const matPuerta = new THREE.MeshStandardMaterial({ color: 0x3a1e0c, roughness: 0.5 }); 
            const matMetal = new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.9, roughness: 0.1 }); 

            const largoPasillo = 10, anchoPasillo = 3.0, alturaTechoPasillo = 2.8;

            const piso = new THREE.Mesh(new THREE.PlaneGeometry(anchoPasillo, largoPasillo), matPiso);
            piso.rotation.x = -Math.PI / 2; piso.position.set(0, 0, 5); grupoPasillo.add(piso);

            const techo = new THREE.Mesh(new THREE.PlaneGeometry(anchoPasillo, largoPasillo), matTecho);
            techo.rotation.x = Math.PI / 2; techo.position.set(0, alturaTechoPasillo, 5); grupoPasillo.add(techo);

            const paredIzq1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, alturaTechoPasillo, 4), matPared);
            paredIzq1.position.set(-anchoPasillo/2, alturaTechoPasillo/2, 8); grupoPasillo.add(paredIzq1);
            const paredIzq2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, alturaTechoPasillo, 4.5), matPared);
            paredIzq2.position.set(-anchoPasillo/2, alturaTechoPasillo/2, 2.25); grupoPasillo.add(paredIzq2);

            const paredDer1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, alturaTechoPasillo, 4), matPared);
            paredDer1.position.set(anchoPasillo/2, alturaTechoPasillo/2, 8); grupoPasillo.add(paredDer1);
            const paredDer2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, alturaTechoPasillo, 4.5), matPared);
            paredDer2.position.set(anchoPasillo/2, alturaTechoPasillo/2, 2.25); grupoPasillo.add(paredDer2);

            const paredFondoIzq = new THREE.Mesh(new THREE.BoxGeometry((anchoPasillo-1.2)/2, alturaTechoPasillo, 0.2), matPared);
            paredFondoIzq.position.set(-anchoPasillo/4 - 0.3, alturaTechoPasillo/2, 0.1); grupoPasillo.add(paredFondoIzq);
            const paredFondoDer = new THREE.Mesh(new THREE.BoxGeometry((anchoPasillo-1.2)/2, alturaTechoPasillo, 0.2), matPared);
            paredFondoDer.position.set(anchoPasillo/4 + 0.3, alturaTechoPasillo/2, 0.1); grupoPasillo.add(paredFondoDer);
            const dintel = new THREE.Mesh(new THREE.BoxGeometry(1.2, alturaTechoPasillo - 2.1, 0.2), matPared);
            dintel.position.set(0, 2.1 + (alturaTechoPasillo - 2.1)/2, 0.1); grupoPasillo.add(dintel);

            const marcoFondo = new THREE.Mesh(new THREE.BoxGeometry(1.3, 2.2, 0.1), matMarco);
            marcoFondo.position.set(0, 1.1, 0.15); grupoPasillo.add(marcoFondo);
            const hojaPuerta1 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.1, 0.05), matPuerta);
            hojaPuerta1.position.set(-0.6, 1.05, 0.2); hojaPuerta1.rotation.y = Math.PI / 2; grupoPasillo.add(hojaPuerta1);
            
            const luzPuerta1 = new THREE.PointLight(0xffaa55, 2, 5);
            luzPuerta1.position.set(0, 1.0, 0.5); grupoPasillo.add(luzPuerta1);

            portalFondo = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.1, 0.3), new THREE.MeshBasicMaterial({ visible: false }));
            portalFondo.position.set(0, 1.05, 0.2); grupoPasillo.add(portalFondo);

            const marcoDer = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 1.3), matMarco);
            marcoDer.position.set(anchoPasillo/2, 1.1, 5); grupoPasillo.add(marcoDer);
            const puertaDer = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.1, 1.0), matPuerta);
            puertaDer.position.set(anchoPasillo/2 - 0.1, 1.05, 5); grupoPasillo.add(puertaDer);

            portalDer = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.1, 1.2), new THREE.MeshBasicMaterial({ visible: false }));
            portalDer.position.set(anchoPasillo/2, 1.05, 5); grupoPasillo.add(portalDer);

            const marcoIzq = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 1.3), matMarco);
            marcoIzq.position.set(-anchoPasillo/2, 1.1, 5); grupoPasillo.add(marcoIzq);
            const puertaIzq = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.1, 1.0), matPuerta);
            puertaIzq.position.set(-anchoPasillo/2 + 0.1, 1.05, 5); grupoPasillo.add(puertaIzq);

            portalIzq = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.1, 1.2), new THREE.MeshBasicMaterial({ visible: false }));
            portalIzq.position.set(-anchoPasillo/2, 1.05, 5); grupoPasillo.add(portalIzq);

            const pisoAsc = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), matMetal);
            pisoAsc.rotation.x = -Math.PI / 2; pisoAsc.position.set(0, 0.01, 10); grupoPasillo.add(pisoAsc);

            const puertaAscIzq = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.3, 0.1), matMetal);
            puertaAscIzq.position.set(-1.3, 1.15, 10); grupoPasillo.add(puertaAscIzq);

            const puertaAscDer = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.3, 0.1), matMetal);
            puertaAscDer.position.set(1.3, 1.15, 10); grupoPasillo.add(puertaAscDer);

            const marcoAsc = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.4, 0.1), new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 }));
            marcoAsc.position.set(0, 1.2, 10.05); grupoPasillo.add(marcoAsc);
            const huecoAsc = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 0.2), matTecho);
            huecoAsc.position.set(0, 1.1, 10.05); grupoPasillo.add(huecoAsc); 

            for (let i = 0; i < 3; i++) {
                const lampara = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 0.2, 16), new THREE.MeshBasicMaterial({ color: 0xffffcc }));
                lampara.position.set(0, alturaTechoPasillo - 0.1, 3 + (i * 2.5)); grupoPasillo.add(lampara);
                const luzP = new THREE.PointLight(0xffffcc, 1, 4);
                luzP.position.set(0, alturaTechoPasillo - 0.2, 3 + (i * 2.5)); grupoPasillo.add(luzP);
            }

            scene.add(grupoPasillo);
        }

        function aplicarFiltroColor(modelo, colorHex, intensidad) {
            modelo.traverse((child) => {
                if (child.isMesh && child.material) {
                    if (!child.userData.colorOriginal) {
                        child.userData.colorOriginal = child.material.color.clone();
                    }
                    const nuevoColor = child.userData.colorOriginal.clone();
                    nuevoColor.lerp(new THREE.Color(colorHex), intensidad);
                    child.material.color.copy(nuevoColor);
                }
            });
        }

        function cambiarNivel(destino) {
            if (transicionEnCurso) return; 
            transicionEnCurso = true;

            const fadeDiv = document.getElementById('fade');
            fadeDiv.style.opacity = 1; 

            setTimeout(() => {
                grupoPasillo.visible = false;
                modeloAptoTipo.visible = false;
                modeloPenthouse.visible = false;
                techoTipo.visible = false;
                techoPenthouse.visible = false;
                cajaExterior.visible = false;

                if (destino === "penthouse") {
                    ubicacionActual = "penthouse";
                    modeloPenthouse.visible = true;
                    techoPenthouse.visible = true;
                    cajaExterior.visible = true;
                    controls.getObject().position.set(0, 1.6, 4); 
                    ambientLight.color.setHex(0xffffff); 
                    ambientLight.intensity = 1.5;
                } 
                else if (destino === "apto2") {
                    ubicacionActual = "apto2";
                    modeloAptoTipo.visible = true;
                    techoTipo.visible = true;
                    cajaExterior.visible = true;
                    controls.getObject().position.set(-2, 1.6, 4); 
                    ambientLight.color.setHex(0xffaa77); 
                    ambientLight.intensity = 2.0;
                    aplicarFiltroColor(modeloAptoTipo, 0xffaa77, 0.4); 
                } 
                else if (destino === "apto3") {
                    ubicacionActual = "apto3";
                    modeloAptoTipo.visible = true;
                    techoTipo.visible = true;
                    cajaExterior.visible = true;
                    controls.getObject().position.set(2, 1.6, 4); 
                    ambientLight.color.setHex(0x88bbff); 
                    ambientLight.intensity = 1.5;
                    aplicarFiltroColor(modeloAptoTipo, 0x88bbff, 0.4); 
                }
                else if (destino === "pasillo") {
                    ubicacionActual = "pasillo";
                    grupoPasillo.visible = true;
                    controls.getObject().position.set(0, 1.6, 1.5); 
                    scene.background = new THREE.Color(0x1a1a1a);
                    scene.fog = new THREE.Fog(0x1a1a1a, 1, 50);
                    ambientLight.color.setHex(0xffeedd); 
                    ambientLight.intensity = 1.2;
                    aplicarFiltroColor(modeloAptoTipo, 0xffffff, 0);
                }

                if (destino !== "pasillo") {
                    scene.background = new THREE.Color(0x87CEEB); 
                    scene.fog = new THREE.Fog(0x87CEEB, 1, 60);
                }

                setTimeout(() => { fadeDiv.style.opacity = 0; transicionEnCurso = false; }, 500);
            }, 500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true && !transicionEnCurso) {
                velocity.x -= velocity.x * 10.0 * 0.016; 
                velocity.z -= velocity.z * 10.0 * 0.016;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * 0.016;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * 0.016;

                controls.moveRight(-velocity.x * 0.016);
                controls.moveForward(-velocity.z * 0.016);

                const pos = controls.getObject().position;

                if (ubicacionActual === "pasillo") {
                    const jugadorBox = new THREE.Box3().setFromCenterAndSize(
                        new THREE.Vector3(pos.x, 1.0, pos.z), 
                        new THREE.Vector3(0.4, 1.8, 0.4)
                    );

                    if (jugadorBox.intersectsBox(new THREE.Box3().setFromObject(portalFondo))) {
                        cambiarNivel("penthouse");
                    }
                    if (jugadorBox.intersectsBox(new THREE.Box3().setFromObject(portalDer))) {
                        cambiarNivel("apto2");
                    }
                    if (jugadorBox.intersectsBox(new THREE.Box3().setFromObject(portalIzq))) {
                        cambiarNivel("apto3");
                    }
                } 
                else if (ubicacionActual === "penthouse" || ubicacionActual === "apto2" || ubicacionActual === "apto3") {
                    if (pos.z > 7.0) {
                        cambiarNivel("pasillo"); 
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

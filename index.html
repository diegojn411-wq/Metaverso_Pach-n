<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diagnóstico 3D - J.Pachón</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #info { 
            position: absolute; top: 20px; width: 100%; text-align: center; 
            color: white; font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; 
            pointer-events: none; z-index: 100; text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <div id="info">Modo Arquitecto: Usa el mouse para rotar, la rueda para zoom, y clic derecho para moverte.</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Cámara elevada para ver todo el escenario
        camera.position.set(0, 20, 20); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Luces muy brillantes para ver todo
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0); 
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Controles de cámara libre
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;

        // 1. PISO INFINITO Y REJILLA (Para tener referencia espacial)
        const gridHelper = new THREE.GridHelper(50, 50, 0x000000, 0x444444);
        scene.add(gridHelper);
        
        const piso = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({ color: 0xcccccc, side: THREE.DoubleSide }));
        piso.rotation.x = -Math.PI / 2;
        piso.position.y = -0.05;
        scene.add(piso);

        // 2. CREAR EL PASILLO Y LA PUERTA EN EL CENTRO (0,0,0)
        const matPiso = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
        const matPared = new THREE.MeshStandardMaterial({ color: 0xdddddd });
        
        // Pasillo (avanza hacia Z negativo)
        const pasillo = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 15), matPared);
        pasillo.position.set(0, 1.5, 7.5); // Desde Z=0 hasta Z=15
        // Lo hacemos invisible por dentro pero visible por fuera para verlo
        pasillo.material.transparent = true;
        pasillo.material.opacity = 0.3; 
        scene.add(pasillo);

        // Puerta en Z=0
        const puerta = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.1), new THREE.MeshStandardMaterial({ color: 0x4a2e15 }));
        puerta.position.set(0, 1, 0);
        scene.add(puerta);

        // 3. CARGAR EL APARTAMENTO
        const loader = new GLTFLoader();
        loader.load('./apartamento.glb', function (gltf) {
            const modelo = gltf.scene;
            
            // Calculamos el tamaño
            const box = new THREE.Box3().setFromObject(modelo);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            // Lo escalamos a 10 metros
            const maxSize = Math.max(size.x, size.y, size.z);
            const scaleFactor = 10 / maxSize;
            modelo.scale.set(scaleFactor, scaleFactor, scaleFactor);

            // LO CENTRAMOS EXACTAMENTE EN (0,0,0)
            // Al restar el centro, obligamos al modelo a ponerse justo en el origen
            modelo.position.x = -center.x * scaleFactor;
            modelo.position.y = -center.y * scaleFactor;
            modelo.position.z = -center.z * scaleFactor;

            scene.add(modelo);

            // Añadimos un recuadro verde para marcar dónde está el centro de la puerta
            const boxHelper = new THREE.BoxHelper(modelo, 0x00ff00);
            scene.add(boxHelper);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

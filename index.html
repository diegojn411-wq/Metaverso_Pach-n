<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metaverso J.Pachón - Apartamento Muestra</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info { 
            position: absolute; top: 20px; width: 100%; text-align: center; 
            color: white; font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; 
            pointer-events: none; z-index: 100; text-shadow: 2px 2px 4px #000;
        }
        #loading { 
            position: absolute; top: 50%; left: 0; width: 100%; text-align: center;
            color: white; font-family: Arial, sans-serif; font-size: 30px; font-weight: bold;
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">Haz clic para entrar. (Usa W, A, S, D y el mouse. Presiona ESC para salir)</div>
    <div id="loading">Cargando entorno...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // Variables de configuración del entorno
        const aptX = 0, aptZ = -20; 
        const pasilloAncho = 2.5;
        const alturaTecho = 2.8;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202020); // Fondo oscuro para dar sensación de interior
            scene.fog = new THREE.Fog(0x202020, 1, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Luces
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0); 
            scene.add(ambientLight);
            
            // Luz del pasillo
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2); 
            dirLight.position.set(0, 10, -10);
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            
            document.body.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                document.getElementById('info').style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                document.getElementById('info').style.display = 'block';
                document.getElementById('info').innerText = "Haz clic para volver a entrar (ESC para salir)";
            });

            scene.add(controls.getObject());

            // Teclado
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // CONSTRUIR EL ENTORNO
            crearEntorno();

            // CARGAR EL APARTAMENTO
            const loader = new GLTFLoader();
            loader.load('./apartamento.glb', function (gltf) {
                document.getElementById('loading').style.display = 'none';
                
                const modelo = gltf.scene;
                
                // Ajuste de escala para que el apartamento ocupe un espacio lógico
                const box = new THREE.Box3().setFromObject(modelo);
                const size = box.getSize(new THREE.Vector3());
                const maxSize = Math.max(size.x, size.y, size.z);
                const scaleFactor = 10 / maxSize; // Escala a 10 metros
                modelo.scale.set(scaleFactor, scaleFactor, scaleFactor);

                // Centrar el modelo
                const center = box.getCenter(new THREE.Vector3());
                modelo.position.x -= center.x * scaleFactor;
                modelo.position.y -= center.y * scaleFactor;
                modelo.position.z -= center.z * scaleFactor;
                
                // Posicionar el apartamento al final del pasillo
                modelo.position.set(aptX, 0, aptZ);

                modelo.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(modelo);

                // Poner la cámara al inicio del pasillo mirando al fondo
                controls.getObject().position.set(0, 1.6, 10); 
            }, undefined, function (error) {
                document.getElementById('loading').innerText = "❌ Error al cargar el modelo.";
                console.error(error);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function crearEntorno() {
            const matPiso = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.4 }); // Piso madera
            const matPared = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.9 }); // Pared blanca
            const matTecho = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1.0 });
            const matPuerta = new THREE.MeshStandardMaterial({ color: 0x4a2e15, roughness: 0.3 }); // Madera oscura

            // 1. PASILLO (Desde Z=10 hasta Z=-15)
            const largoPasillo = 25;
            
            // Piso
            const piso = new THREE.Mesh(new THREE.PlaneGeometry(pasilloAncho, largoPasillo), matPiso);
            piso.rotation.x = -Math.PI / 2;
            piso.position.set(0, 0, 10 - (largoPasillo/2));
            scene.add(piso);

            // Techo
            const techo = new THREE.Mesh(new THREE.PlaneGeometry(pasilloAncho, largoPasillo), matTecho);
            techo.rotation.x = Math.PI / 2;
            techo.position.set(0, alturaTecho, 10 - (largoPasillo/2));
            scene.add(techo);

            // Paredes laterales
            const paredIzq = new THREE.Mesh(new THREE.BoxGeometry(0.1, alturaTecho, largoPasillo), matPared);
            paredIzq.position.set(-pasilloAncho/2, alturaTecho/2, 10 - (largoPasillo/2));
            scene.add(paredIzq);

            const paredDer = new THREE.Mesh(new THREE.BoxGeometry(0.1, alturaTecho, largoPasillo), matPared);
            paredDer.position.set(pasilloAncho/2, alturaTecho/2, 10 - (largoPasillo/2));
            scene.add(paredDer);

            // 2. PUERTA DE ENTRADA (Al final del pasillo)
            // Marco de la puerta (blanco)
            const marco = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.1), matPared);
            marco.position.set(0, 1.1, -14); 
            scene.add(marco);
            
            // Hoja de la puerta (marrón)
            const hojaPuerta = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.0, 0.05), matPuerta);
            hojaPuerta.position.set(0, 1.0, -13.95); 
            scene.add(hojaPuerta);

            // Pared del fondo del pasillo (alrededor de la puerta)
            const paredFondo = new THREE.Mesh(new THREE.BoxGeometry(pasilloAncho, alturaTecho, 0.1), matPared);
            paredFondo.position.set(0, alturaTecho/2, -14.1);
            scene.add(paredFondo);

            // 3. EL ELEVADOR (Detrás de la cámara al inicio)
            const pisoAsc = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), new THREE.MeshStandardMaterial({ color: 0x888888 }));
            pisoAsc.rotation.x = -Math.PI / 2;
            pisoAsc.position.set(0, 0.01, 11);
            scene.add(pisoAsc);

            // Puertas del ascensor abiertas (dejando el paso libre)
            const puertaAscIzq = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.1), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 }));
            puertaAscIzq.position.set(-1.25, 1.1, 10.5);
            scene.add(puertaAscIzq);

            const puertaAscDer = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.1), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 }));
            puertaAscDer.position.set(1.25, 1.1, 10.5);
            scene.add(puertaAscDer);

            // Luces del techo del pasillo (pequeñas esferas emisivas)
            for (let i = 0; i < 5; i++) {
                const luz = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffcc }));
                luz.position.set(0, alturaTecho - 0.1, 8 - (i * 4));
                scene.add(luz);
            }

            // 4. CREAR EL TECHO DEL APARTAMENTO (Para que no se vea el cielo)
            const techoApt = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), matTecho);
            techoApt.rotation.x = Math.PI / 2;
            techoApt.position.set(aptX, alturaTecho, aptZ);
            scene.add(techoApt);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                velocity.x -= velocity.x * 10.0 * 0.016; 
                velocity.z -= velocity.z * 10.0 * 0.016;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * 0.016;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * 0.016;

                controls.moveRight(-velocity.x * 0.016);
                controls.moveForward(-velocity.z * 0.016);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

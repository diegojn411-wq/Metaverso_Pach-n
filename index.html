<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recorrido 3D - J.Pachón</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #info { 
            position: absolute; top: 10px; width: 100%; text-align: center; 
            color: white; font-family: Arial, sans-serif; font-size: 20px; font-weight: bold;
            pointer-events: none; z-index: 100; text-shadow: 1px 1px 2px black;
        }
        #loading {
            position: absolute; top: 50%; width: 100%; text-align: center;
            color: white; font-family: Arial, sans-serif; font-size: 30px; font-weight: bold;
            pointer-events: none; z-index: 100; text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Usa las flechas ↑ ↓ ← → para moverte, el mouse para mirar, y la rueda para el zoom.</div>
    <div id="loading">Cargando apartamento... (Espera unos segundos)</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Escena y Cámara
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        // Ponemos la cámara bien lejos y arriba para ver todo el modelo
        camera.position.set(10, 15, 10); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Luces (Muy brillantes para que nada quede en sombra)
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0); 
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 3. Controles tipo Metaverso (Vuelo con flechas y mouse)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true; 
        controls.maxDistance = 500;
        controls.minDistance = 0.5;
        
        // Aquí mapeamos las flechas del teclado para que se muevan
        controls.listenToKeyEvents(window); 
        controls.keys = {
            LEFT: 'ArrowLeft', // izquierda
            UP: 'ArrowUp', // arriba
            RIGHT: 'ArrowRight', // derecha
            BOTTOM: 'ArrowDown' // abajo
        };

        // 4. Cargar el Modelo
        const loader = new GLTFLoader();
        loader.load('./apartamento.glb', function (gltf) {
            
            // ESTO QUITA EL MENSAJE DE "CARGANDO"
            document.getElementById('loading').innerText = "¡Apartamento cargado!";
            setTimeout(() => { document.getElementById('loading').innerText = ""; }, 3000);

            const modelo = gltf.scene;
            
            // --- EL TRUCO MÁGICO DE ESCALA ---
            // Los modelos 3D a veces vienen en centímetros o milímetros. 
            // Vamos a hacer que el modelo mida más o menos 10 metros.
            const box = new THREE.Box3().setFromObject(modelo);
            const size = box.getSize(new THREE.Vector3());
            const maxSize = Math.max(size.x, size.y, size.z);
            const scaleFactor = 10 / maxSize;
            
            // Ajustamos el tamaño del modelo
            modelo.scale.set(scaleFactor, scaleFactor, scaleFactor);
            
            // Lo centramos en el medio de la escena
            const center = box.getCenter(new THREE.Vector3());
            modelo.position.x += (modelo.position.x - center.x) * scaleFactor;
            modelo.position.y += (modelo.position.y - center.y) * scaleFactor;
            modelo.position.z += (modelo.position.z - center.z) * scaleFactor;

            scene.add(modelo);
            
            // Enfocar la cámara en el modelo
            controls.target.set(0, 0, 0);

        }, undefined, function (error) {
            console.error('Error:', error);
            document.getElementById('loading').innerText = "❌ Error: No se encontró el archivo.";
            document.getElementById('loading').style.color = "red";
        });

        // 5. Animación
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        animate();

        // Ajustar tamaño
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

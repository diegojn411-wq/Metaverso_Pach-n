<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recorrido 3D - J.Pachón</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: Arial, sans-serif; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>
    <div id="info">Haz clic para empezar a caminar (Usa W, A, S, D y el mouse. Presiona ESC para salir)</div>

    <!-- Importamos la librería Three.js desde internet -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 1. Configurar la escena, cámara y luces
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Color de fondo celeste

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6; // Altura de los ojos (1.6 metros)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Luces mejoradas
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); 
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 2. Cargar el modelo 3D (.glb) - RUTA CORREGIDA
        const loader = new GLTFLoader();
        // Aquí está el cambio: busca el archivo directo, sin subcarpetas
        loader.load('Apartamento.glb', function (gltf) {
            const modelo = gltf.scene;
            modelo.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(modelo);
        }, undefined, function (error) {
            console.error('Error al cargar el modelo:', error);
            alert('No se encontró el archivo. Revisa la ruta en el código.');
        });

        // 3. Controles en Primera Persona (Caminar)
        const controls = new PointerLockControls(camera, document.body);
        
        document.addEventListener('click', function () {
            controls.lock(); // Bloquea el mouse para mirar alrededor
        });

        const moveSpeed = 5.0;
        const keys = { w: false, a: false, s: false, d: false };

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
        });

        // 4. Animación y movimiento
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (controls.isLocked) {
                if (keys.w) controls.moveForward(moveSpeed * delta);
                if (keys.s) controls.moveForward(-moveSpeed * delta);
                if (keys.a) controls.moveRight(-moveSpeed * delta);
                if (keys.d) controls.moveRight(moveSpeed * delta);
            }

            renderer.render(scene, camera);
        }

        animate();

        // Ajustar tamaño si se cambia el tamaño de la ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recorrido 3D - J.Pachón</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: Arial, sans-serif; pointer-events: none; z-index: 100; }
    </style>
</head>
<body>
    <div id="info">Usa las flechas del teclado (↑ ↓ ← →) o W, A, S, D para volar. Usa Q y E para subir y bajar.</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Escena y Cámara
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 10); // Cámara elevada para ver todo desde arriba al inicio

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0); 
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); 
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 3. Controles de Vuelo (OrbitControls)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Suaviza el movimiento
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true; 
        controls.maxDistance = 100; // Límite de alejamiento

        // 4. Cargar el Modelo
        const loader = new GLTFLoader();
        loader.load('./apartamento.glb', function (gltf) {
            const modelo = gltf.scene;
            
            // --- TRUCO DE ESCALA ---
            // Si el modelo está en centímetros (muy grande) o milímetros, lo ajustamos.
            // Prueba con estos números. Si sigue muy grande, cambia 1 a 0.01
            modelo.scale.set(1, 1, 1); 
            
            scene.add(modelo);
        }, undefined, function (error) {
            console.error('Error al cargar el modelo:', error);
            alert('No se encontró el archivo apartamento.glb en la carpeta.');
        });

        // 5. Animación
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Necesario para que funcione el mouse
            renderer.render(scene, camera);
        }

        animate();

        // Ajustar tamaño
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

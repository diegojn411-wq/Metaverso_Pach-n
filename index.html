<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Metaverso J.Pachón - Apartamento Muestra</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        #info { 
            position: absolute; top: 20px; width: 100%; text-align: center; 
            color: white; font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; 
            pointer-events: none; z-index: 100; text-shadow: 2px 2px 4px #000;
        }
        #loading { 
            position: absolute; top: 50%; left: 0; width: 100%; text-align: center;
            color: white; font-family: Arial, sans-serif; font-size: 30px; font-weight: bold;
            pointer-events: none; z-index: 100;
        }
        #fade { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: black; opacity: 0; pointer-events: none; 
            transition: opacity 0.5s ease-in-out; z-index: 999;
        }
    </style>
</head>
<body>
    <div id="info">Haz clic para entrar. (Usa W, A, S, D y el mouse)</div>
    <div id="loading">Cargando entorno...</div>
    <div id="fade"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        let enElPasillo = true;
        let transicionEnCurso = false;
        
        let modeloApartamento;
        let grupoPasillo;
        let techoApt; // Guardamos el techo para ajustarlo luego

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a); 
            scene.fog = new THREE.Fog(0x1a1a1a, 1, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); 
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2); 
            dirLight.position.set(0, 10, 10);
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            
            document.body.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                document.getElementById('info').style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                document.getElementById('info').style.display = 'block';
                document.getElementById('info').innerText = "Haz clic para volver a entrar (ESC para salir)";
            });

            scene.add(controls.getObject());

            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                }
            };
            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                }
            };
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            const loader = new GLTFLoader();
            loader.load('./apartamento.glb', function (gltf) {
                document.getElementById('loading').style.display = 'none';
                
                modeloApartamento = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(modeloApartamento);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                const maxSize = Math.max(size.x, size.y, size.z);
                const scaleFactor = 10 / maxSize;
                
                modeloApartamento.scale.set(scaleFactor, scaleFactor, scaleFactor);
                modeloApartamento.position.x = -center.x * scaleFactor;
                modeloApartamento.position.y = -box.min.y * scaleFactor;
                modeloApartamento.position.z = -center.z * scaleFactor;
                
                modeloApartamento.visible = false; 
                scene.add(modeloApartamento);

                // --- EL TRUCO DEL TECHO ---
                // Calculamos la altura real del modelo 3D y le sumamos 10 centímetros
                // para que quede perfectamente apoyado sobre las paredes.
                const alturaRealApt = size.y * scaleFactor + 0.1; 

                techoApt = new THREE.Mesh(new THREE.PlaneGeometry(15, 15), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
                techoApt.rotation.x = Math.PI / 2;
                // Usamos la altura calculada
                techoApt.position.set(0, alturaRealApt, 0);
                techoApt.name = "techoApt";
                techoApt.visible = false;
                scene.add(techoApt);

                // Añadimos una caja exterior para que no se vea el cielo por las ventanas
                const cajaExterior = new THREE.Mesh(
                    new THREE.BoxGeometry(20, 20, 20), 
                    new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide }) // Celeste por dentro
                );
                cajaExterior.position.set(0, 10, 0);
                cajaExterior.visible = false;
                cajaExterior.name = "cajaExterior";
                scene.add(cajaExterior);

                crearPasillo();
                controls.getObject().position.set(0, 1.6, 8); 

            }, undefined, function (error) {
                document.getElementById('loading').innerText = "❌ Error al cargar el modelo.";
            });

            window.addEventListener('resize', onWindowResize);
        }

        function crearPasillo() {
            grupoPasillo = new THREE.Group();
            const matPiso = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 });
            const matPared = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.9 });
            const matTecho = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide });
            const matPuerta = new THREE.MeshStandardMaterial({ color: 0x4a2e15 });
            const matMetal = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8, roughness: 0.2 });

            const largoPasillo = 12;
            const anchoPasillo = 2.5;
            const alturaTechoPasillo = 2.8;

            const piso = new THREE.Mesh(new THREE.PlaneGeometry(anchoPasillo, largoPasillo), matPiso);
            piso.rotation.x = -Math.PI / 2;
            piso.position.set(0, 0, largoPasillo/2);
            grupoPasillo.add(piso);

            const techo = new THREE.Mesh(new THREE.PlaneGeometry(anchoPasillo, largoPasillo), matTecho);
            techo.rotation.x = Math.PI / 2;
            techo.position.set(0, alturaTechoPasillo, largoPasillo/2);
            grupoPasillo.add(techo);

            const paredIzq = new THREE.Mesh(new THREE.BoxGeometry(0.1, alturaTechoPasillo, largoPasillo), matPared);
            paredIzq.position.set(-anchoPasillo/2, alturaTechoPasillo/2, largoPasillo/2);
            grupoPasillo.add(paredIzq);

            const paredDer = new THREE.Mesh(new THREE.BoxGeometry(0.1, alturaTechoPasillo, largoPasillo), matPared);
            paredDer.position.set(anchoPasillo/2, alturaTechoPasillo/2, largoPasillo/2);
            grupoPasillo.add(paredDer);

            const paredFondoIzq = new THREE.Mesh(new THREE.BoxGeometry((anchoPasillo-1.2)/2, alturaTechoPasillo, 0.2), matPared);
            paredFondoIzq.position.set(-anchoPasillo/4 - 0.3, alturaTechoPasillo/2, 0.5);
            grupoPasillo.add(paredFondoIzq);

            const paredFondoDer = new THREE.Mesh(new THREE.BoxGeometry((anchoPasillo-1.2)/2, alturaTechoPasillo, 0.2), matPared);
            paredFondoDer.position.set(anchoPasillo/4 + 0.3, alturaTechoPasillo/2, 0.5);
            grupoPasillo.add(paredFondoDer);

            const dintel = new THREE.Mesh(new THREE.BoxGeometry(1.2, alturaTechoPasillo - 2.1, 0.2), matPared);
            dintel.position.set(0, 2.1 + (alturaTechoPasillo - 2.1)/2, 0.5);
            grupoPasillo.add(dintel);

            const hojaPuerta = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.1, 0.05), matPuerta);
            hojaPuerta.position.set(-0.6, 1.05, 0.45); 
            hojaPuerta.rotation.y = Math.PI / 2;
            grupoPasillo.add(hojaPuerta);

            const pisoAsc = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), matMetal);
            pisoAsc.rotation.x = -Math.PI / 2;
            pisoAsc.position.set(0, 0.01, 10.5);
            grupoPasillo.add(pisoAsc);

            const puertaAscIzq = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.3, 0.1), matMetal);
            puertaAscIzq.position.set(-1.3, 1.15, 10.5);
            grupoPasillo.add(puertaAscIzq);

            const puertaAscDer = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.3, 0.1), matMetal);
            puertaAscDer.position.set(1.3, 1.15, 10.5);
            grupoPasillo.add(puertaAscDer);

            for (let i = 0; i < 4; i++) {
                const luz = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffcc }));
                luz.position.set(0, alturaTechoPasillo - 0.05, 2 + (i * 3));
                grupoPasillo.add(luz);
            }

            scene.add(grupoPasillo);
        }

        function cambiarNivel() {
            if (transicionEnCurso) return; 
            transicionEnCurso = true;

            const fadeDiv = document.getElementById('fade');
            fadeDiv.style.opacity = 1; 

            setTimeout(() => {
                if (enElPasillo) {
                    enElPasillo = false;
                    grupoPasillo.visible = false;
                    modeloApartamento.visible = true;
                    techoApt.visible = true;
                    scene.getObjectByName("cajaExterior").visible = true; // Mostrar cielo exterior falso
                    
                    controls.getObject().position.set(0, 1.6, 3); 
                    scene.background = new THREE.Color(0x87CEEB); 
                    scene.fog = new THREE.Fog(0x87CEEB, 1, 60);
                } else {
                    enElPasillo = true;
                    grupoPasillo.visible = true;
                    modeloApartamento.visible = false;
                    techoApt.visible = false;
                    scene.getObjectByName("cajaExterior").visible = false; 
                    
                    controls.getObject().position.set(0, 1.6, 2); 
                    scene.background = new THREE.Color(0x1a1a1a);
                    scene.fog = new THREE.Fog(0x1a1a1a, 1, 50);
                }

                setTimeout(() => {
                    fadeDiv.style.opacity = 0; 
                    transicionEnCurso = false;
                }, 500);
            }, 500);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true && !transicionEnCurso) {
                velocity.x -= velocity.x * 10.0 * 0.016; 
                velocity.z -= velocity.z * 10.0 * 0.016;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * 0.016;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * 0.016;

                controls.moveRight(-velocity.x * 0.016);
                controls.moveForward(-velocity.z * 0.016);

                const pos = controls.getObject().position;
                if (enElPasillo && pos.z < 1.0) {
                    cambiarNivel(); 
                } else if (!enElPasillo && pos.z > 5.0) {
                    cambiarNivel(); 
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>

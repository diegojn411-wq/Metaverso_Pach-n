<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recorrido 3D - J.Pachón</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #info { 
            position: absolute; top: 10px; width: 100%; text-align: center; 
            color: white; font-family: Arial, sans-serif; font-size: 18px; 
            pointer-events: none; z-index: 100; text-shadow: 1px 1px 2px black;
        }
        #loading { 
            position: absolute; top: 50%; width: 100%; text-align: center;
            color: white; font-family: Arial, sans-serif; font-size: 30px; font-weight: bold;
            pointer-events: none; z-index: 100; text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Haz clic para entrar al apartamento (Usa W, A, S, D para caminar y el mouse para mirar. ESC para salir)</div>
    <div id="loading">Cargando apartamento...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls, modelo;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 0, 30); // Niebla para que no veas el vacío fuera

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Luces
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); 
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); 
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Controles en Primera Persona (Caminar)
            controls = new PointerLockControls(camera, document.body);
            
            // Evento para hacer clic y entrar en modo caminar
            document.body.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                document.getElementById('info').style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                document.getElementById('info').style.display = 'block';
                document.getElementById('info').innerText = "Haz clic para volver a entrar (ESC para salir)";
            });

            scene.add(controls.getObject());

            // Movimiento con teclado
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = true; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                    case 'ArrowRight': case 'KeyD': moveRight = true; break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp': case 'KeyW': moveForward = false; break;
                    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                    case 'ArrowRight': case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Cargar el modelo
            const loader = new GLTFLoader();
            loader.load('./apartamento.glb', function (gltf) {
                document.getElementById('loading').style.display = 'none';
                
                modelo = gltf.scene;
                
                // Ajuste de escala para que la cámara quede a la altura de los ojos
                const box = new THREE.Box3().setFromObject(modelo);
                const size = box.getSize(new THREE.Vector3());
                const maxSize = Math.max(size.x, size.y, size.z);
                const scaleFactor = 10 / maxSize;
                modelo.scale.set(scaleFactor, scaleFactor, scaleFactor);

                // Centrar el modelo
                const center = box.getCenter(new THREE.Vector3());
                modelo.position.x -= center.x * scaleFactor;
                modelo.position.y -= center.y * scaleFactor;
                modelo.position.z -= center.z * scaleFactor;
                
                // Poner el piso a la altura 0
                modelo.position.y += (size.y * scaleFactor) / 2;

                // Activar colisiones básicas con las paredes
                modelo.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(modelo);

                // Colocar la cámara a 1.6 metros de altura (altura de los ojos) al inicio
                controls.getObject().position.y = 1.6;
                controls.getObject().position.z = 5; // Un poco hacia atrás para que no aparezca dentro de una pared
            }, undefined, function (error) {
                document.getElementById('loading').innerText = "❌ Error al cargar el modelo.";
                console.error(error);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                // Fricción (frenado)
                velocity.x -= velocity.x * 10.0 * 0.016; 
                velocity.z -= velocity.z * 10.0 * 0.016;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // Evita que te muevas más rápido en diagonal

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * 0.016;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * 0.016;

                controls.moveRight(-velocity.x * 0.016);
                controls.moveForward(-velocity.z * 0.016);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
